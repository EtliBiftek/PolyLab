name: Debug cargo errors

on:
  push:
    branches:
      - "arena/01a07595-polylab"

permissions:
  contents: write

jobs:
  debug:
    if: ${{ !contains(github.event.head_commit.message, '[ci-log]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test core (capture)
        working-directory: core
        run: cargo test 2>&1 | tee /tmp/cargo-all.log || true

      - name: Clippy core (capture)
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings 2>&1 | tee -a /tmp/cargo-all.log || true

      - name: Build core (capture)
        working-directory: core
        run: cargo build 2>&1 | tee -a /tmp/cargo-all.log || true

      - name: Upload log to the branch [ci-log]
        run: |
          mkdir -p ci-debug
          cp /tmp/cargo-all.log ci-debug/cargo-all.log
          git config user.email "ci-debug@example.com"
          git config user.name "ci-debug"
          git add -f ci-debug/cargo-all.log
          git commit -m "ci: upload cargo log [ci-log]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:arena/01a07595-polylab
