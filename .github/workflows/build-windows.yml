name: Build Windows (setup + portable)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test core
        working-directory: core
        run: cargo test

      - name: Lint core (deny warnings)
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: Build core
        working-directory: core
        run: cargo build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore optional deps (keyring, tiktoken)
        run: node scripts/enable-optional-deps.mjs

      - name: Build core (release)
        working-directory: core
        run: cargo build --release --features tiktoken

      - name: Build renderer + desktop
        run: pnpm build

      - name: Package (NSIS setup + portable exe)
        run: pnpm exec electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polylab-windows-x64
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Attach exes to tag release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "PolyLab $GITHUB_REF_NAME" --generate-notes release/*.exe || gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
